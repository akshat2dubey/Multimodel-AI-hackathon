name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest bandit pip-audit
      - run: pytest -q
      - run: bandit -r scripts dashboard -ll
      - run: pip-audit -r requirements.txt
      - uses: gitleaks/gitleaks-action@v2
